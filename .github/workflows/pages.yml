name: Pages

# Publishes the documentation site from the repository's own README files.
# Runs only when documentation changes, so a script-only commit does not
# redeploy the site.
on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '_config.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow one deployment at a time; do not cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
