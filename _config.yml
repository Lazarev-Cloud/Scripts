# Jekyll configuration for the GitHub Pages site.
#
# The site is built from the repository's own README files. There is no
# separate docs tree and no per-page front matter: these READMEs are read on
# GitHub far more often than on the site, and GitHub renders YAML front matter
# as a metadata table rather than hiding it, so adding it would put a block of
# Jekyll bookkeeping at the top of every page in the repository view.
#
# That constraint drives the two settings below. `jekyll-optional-front-matter`
# is a default GitHub Pages plugin and is what lets a plain .md file be treated
# as a page at all; `defaults` then gives every one of those pages a layout,
# which is what a themed site needs and what front matter would otherwise
# supply. A theme with a generated sidebar (just-the-docs and friends) cannot
# work here, because its navigation is built from per-page `title`/`nav_order`
# front matter. Navigation is the index links the READMEs already carry.
#
# jekyll-theme-primer is one of the themes GitHub Pages supports natively, so
# it needs no `remote_theme` and no pinned third-party revision.

title: Lazarev Cloud Scripts
description: Maintenance scripts for Linux, Proxmox VE and Windows. Safe by default, cron-ready, zero lint findings.
theme: jekyll-theme-primer
url: https://lazarev-cloud.github.io
baseurl: /Scripts

permalink: pretty

defaults:
  - scope:
      path: ''
    values:
      layout: default

# Everything that is not documentation.
exclude:
  - .github/
  - .gitattributes
  - .gitignore
  - CLAUDE.md
  - install.sh
  - lib/
  - monitoring/prometheus_unified_metrics.py
  - monitoring/requirements.txt
  - monitoring/setup_prometheus_exporter.sh
  - vendor/
  - Gemfile
  - Gemfile.lock
  - "**/*.sh"
  - "**/*.ps1"
  - "**/*.py"

plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-seo-tag
